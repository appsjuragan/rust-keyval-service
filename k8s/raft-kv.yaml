apiVersion: v1
kind: Service
metadata:
  name: raft-kv
  labels:
    app: raft-kv
spec:
  ports:
  - port: 8080
    name: http
  - port: 50051
    name: grpc
  clusterIP: None
  selector:
    app: raft-kv
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raft-kv
spec:
  serviceName: "raft-kv"
  replicas: 3
  selector:
    matchLabels:
      app: raft-kv
  template:
    metadata:
      labels:
        app: raft-kv
    spec:
      containers:
      - name: raft-kv
        image: raft-kv:latest
        ports:
        - containerPort: 8080
        - containerPort: 50051
        env:
        - name: K8S_SERVICE_NAME
          value: "raft-kv"
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: HTTP_PORT
          value: "8080"
        - name: GRPC_PORT
          value: "50051"
        # Initial leader selection could be based on raft-kv-0 for bootstrap
        - name: IS_LEADER
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Note: In a real production system, you'd use a more robust bootstrap logic.
        # Here we can use a script to set IS_LEADER if name is raft-kv-0.
