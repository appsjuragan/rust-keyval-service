[package]
name = "raft-kv"
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

[dependencies]
# Async runtime (non-blocking networking, timers, tasks)
tokio = { version = "1.37", features = ["macros", "net", "io-util", "rt-multi-thread", "sync", "full"] }

# Concurrent in-memory map (lock-sharded, high throughput)
dashmap = "5.5"

# Serialization for replication messages
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Error handling
anyhow = "1.0"
axum = "0.8.8"
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
serde_json = "1.0.148"
clap = { version = "4.5.53", features = ["env", "derive"] }
reqwest = { version = "0.12.28", features = ["json"] }

[build-dependencies]
tonic-build = "0.12"
