services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: kv-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    networks:
      - kv-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q status" ]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kv-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - kv-network

  kv-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kv-service
    environment:
      - ES_URL=http://elasticsearch:9200
    ports:
      - "11223:11223"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - kv-network
    restart: unless-stopped

  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
    container_name: kv-backoffice
    ports:
      - "8080:80"
    networks:
      - kv-network
    restart: unless-stopped

volumes:
  es-data:
    driver: local

networks:
  kv-network:
    driver: bridge
